    <style>

        }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: var(--slate-50); display: flex; height: 100vh; overflow: hidden; }
        
        aside { 
            width: var(--sidebar-width); background: var(--slate-900); color: white;

        .cwf-wrapper { margin: 15px 30px 5px 30px; flex-shrink: 0; }
        .cwf-toggle-btn { width: 100%; background: #eff6ff; border: 1px solid #dbeafe; padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .cwf-toggle-label { font-size: 13px; text-transform: uppercase; font-weight: 800; color: var(--blue-600); letter-spacing: 0.025em; }

        .stats-bar { padding: 5px 30px; display: flex; justify-content: flex-end; align-items: center; }

        .count-val { color: var(--primary); font-weight: 800; margin-left: 4px; }
        .table-viewport {
    flex: 1;
    overflow: auto;
    padding: 0 40px 40px 20px; /* Increased right and bottom padding */
}
        #grid {
    border-collapse: collapse;
    background: white;
    width: 100%;

}
/* Ensure the header and rows still look right for the main grid */
#grid th {
    background: var(--slate-100);
    padding: 12px;

}

        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        }

            background: #f0fdf4;
        }

}

.peer-item { font-size: 13px; color: #1e293b; }

}

/* Ensure links in modals/pop-ups scale with large text mode */
body.large-text .modal-large a,

    function cleanText(str) {
        if (!str) return "";
        let filtered = "";
        for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i);
            if (code === 32 || (code >= 33 && code <= 126)) filtered += str[i];
        }
        let clean = filtered;
        if (clean.match(/(\b\w\s){3,}/g)) {
            clean = clean.replace(/(\b\w)\s(?=\w\b)/g, '$1');
        }
        return clean.replace(/\s+/g, ' ').trim();
    }

    const descCol = skillHeaders.find(h => h.toLowerCase().includes('proficiency') && h.toLowerCase().includes('desc'));

    // 2. Filter and de-duplicate levels using a Map (Key = Level)
const levelMap = new Map();
skillData.forEach(d => {
    let rawTitle = (d[titleCol] || "").toString().trim();
    let cleanTitle = rawTitle.replace(/\s*level\s*\d+/gi, "").replace(/\s*\(.*?\)\s*/g, "").trim();

    if (cleanTitle === baseSkillName) {
        const lvl = d[levelCol];
        let desc = (d[descCol] || "No description available.").toString().trim();

        // --- ROBUST DUPLICATE REMOVAL LOGIC ---
        if (desc && desc !== "-" && desc !== "No description available.") {
            // 1. Split by periods or newlines
            const rawParts = desc.split(/[.\n]/);
            
            const uniqueSentences = [];
            const seenNormalized = new Set();

            rawParts.forEach(part => {
                const trimmed = part.trim();
                if (trimmed.length > 2) {
                    // 2. Normalize: Remove EVERYTHING except letters and numbers
                    // This catches duplicates even if one has a dot and the other doesn't
                    const normalized = trimmed.toLowerCase().replace(/[^a-z0-9]/g, "");
                    
                    if (!seenNormalized.has(normalized)) {
                        seenNormalized.add(normalized);
                        uniqueSentences.push(trimmed);
                    }
                }
            });
            
            // 3. Rebuild the description with unique sentences
            desc = uniqueSentences.join('. ') + '.';
        }
        // -------------------------------------

        // Only add to map if the level hasn't been seen yet
        if (!levelMap.has(lvl)) {
            levelMap.set(lvl, desc);
        }
    }
});

/* --- AMENDED DATA EXTRACTION & MAPPING LOGIC --- */

// ✅ GLOBAL STATE
window.isTrackFilterOn = window.isTrackFilterOn || false;

const currentRole = document.getElementById('sel-role').value;
const currentSector = document.getElementById('sel-sector').value;

const isTrackFilterOn = window.isTrackFilterOn === true;

// 1. DYNAMIC HEADER MAPPING
const rCol = cwfHeaders.find(h => h.toLowerCase().includes('role'));
const fCol = cwfHeaders.find(h => h.toLowerCase().includes('function'));
const sKey = jobHeaders.find(h => h.toLowerCase().includes('sector'));
const rKey = jobHeaders.find(h => h.toLowerCase().includes('role'));
const tscCol = jobHeaders.find(h => h.toLowerCase().includes('title'));
const pLevelCol = jobHeaders.find(h => h.toLowerCase().includes('proficiency level'));
const tCol = jobHeaders.find(h => h && h.toLowerCase().includes('track'));

// ✅ GET FIRST VALID TRACK
const currentRoleTrack = (
    jobData.find(d => 
        d[rKey] === currentRole &&
        d[tCol] &&
        d[tCol].toString().trim() !== ""
    )?.[tCol] || ""
).toString().toLowerCase().trim();

const currentRoleTrackpc = (
    jobData.find(d => 
        d[rKey] === currentRole &&
        d[tCol] &&
        d[tCol].toString().trim() !== ""
    )?.[tCol] || ""
).toString().trim();

// ✅ TRACK MATCHER
const matchesTrack = (rowTrack) => {
    // Look at the global state directly so it responds to clicks
    if (!window.isTrackFilterOn) return true;

    const value = (rowTrack || "").toString().toLowerCase().trim();
    if (!currentRoleTrack) return true;

    return value === currentRoleTrack;
};

// 2. SECTOR ROLES
const sectorRoles = [...new Set(jobData
    .filter(d => 
        d[sKey] === currentSector &&
        d[rKey] !== currentRole &&
        matchesTrack(d[tCol])
    )
    .map(d => d[rKey])
)].sort();

// ✅ NEW: DROPDOWN REFRESH (no modal reload)
window.refreshRoleDropdown = function() {
    const select = document.getElementById('compare-role-select');
    if (!select) return;

    const selectedValue = select.value;

    const newOptions = [
        '<option value="">-- Select Role --</option>',
        ...sectorRoles
            .filter(r => r !== currentRole)
            .map(r => `<option value="${r}">${r}</option>`)
    ];

    select.innerHTML = newOptions.join('');

    if (sectorRoles.includes(selectedValue)) {
        select.value = selectedValue;
    }
};
window.handleTrackToggle = function(checkbox) {
    // 1. Update the global state
    window.isTrackFilterOn = checkbox.checked;

    // 2. Get current context (Sector and Role)
    const currentSector = document.getElementById('sel-sector').value;
    const currentRole = document.getElementById('sel-role').value;
    
    // 3. Recalculate the filtered roles list
    const filteredRoles = [...new Set(jobData
        .filter(d => {
            const isSameSector = d[sKey] === currentSector;
            const isNotCurrentRole = d[rKey] !== currentRole;
            // Use your existing matchesTrack logic
            const trackMatch = matchesTrack(d[tCol]); 
            return isSameSector && isNotCurrentRole && trackMatch;
        })
        .map(d => d[rKey])
    )].sort();

    // 4. Update the dropdown list in the modal
    const select = document.getElementById('compare-role-select');
    if (select) {
        const previousValue = select.value;
        const newOptions = [
            '<option value="">-- Select Role --</option>',
            ...filteredRoles.map(r => `<option value="${r}">${r}</option>`)
        ];
        select.innerHTML = newOptions.join('');
        
        // Keep previous selection if it's still valid under the new filter
        if (filteredRoles.includes(previousValue)) {
            select.value = previousValue;
        } else {
            // Clear comparison content if the previously selected role is filtered out
            const contentArea = document.getElementById('comparison-content-area');
            if (contentArea) contentArea.innerHTML = '<p style="color:#94a3b8; padding:20px;">Please select a role.</p>';
        }
    }
};
// 3. SKILL MAP GENERATOR
const getSkillMapForRole = (roleName) => {
    if (!roleName) return {};
    
    const roleRows = jobData.filter(d => 
        d[rKey] === roleName &&
        matchesTrack(d[tCol])
    );

    const skillMap = {};

    roleRows.forEach(d => {
        let rawSkill = (d[tscCol] || "").toString();
        
        let cleanSkill = rawSkill
            .replace(/↗/g, "")
            .replace(/\s*level\s*\d+/gi, "")
            .trim();

        let levelValue = d[pLevelCol] ? d[pLevelCol].toString().trim() : "";

        if (levelValue === "") {
            let match = rawSkill.match(/level\s*(\d+)/i);
            levelValue = match ? match[1] : "0";
        }

        if (cleanSkill) {
            skillMap[cleanSkill.toUpperCase()] = {
                fullName: cleanSkill,
                level: levelValue
            };
        }
    });

    return skillMap;
};

window.updateComparisonContent=(selectedRole)=>{

const currentCWF=[...new Set(
cwfData.filter(d=>d[rCol]===currentRole).map(d=>d[fCol])
)];

if(!selectedRole){

document.getElementById('current-content-target').innerHTML=getCWFHtml(currentRole);

document.getElementById('common-skills-target').innerHTML="";

}

const selectedCWF=[...new Set(
cwfData.filter(d=>d[rCol]===selectedRole).map(d=>d[fCol])
)];

const mapA=getSkillMapForRole(currentRole);
const mapB=getSkillMapForRole(selectedRole);

const commonKeys=Object.keys(mapA).filter(k=>mapB.hasOwnProperty(k));

const skillsHtml=commonKeys.length>0
?commonKeys
.map(k=>{

const sA=mapA[k];
const sB=mapB[k];

const isNumericA=!isNaN(sA.level)&&sA.level!=="";
const isNumericB=!isNaN(sB.level)&&sB.level!=="";

const numA=isNumericA?parseInt(sA.level):0;
const numB=isNumericB?parseInt(sB.level):0;

const diffValue=numB-numA;

const isExactMatch=sA.level===sB.level;
const getNonNumeric=(val)=>String(val).replace(/\d/g,'').trim();

const isSameCategory=getNonNumeric(sA.level)===getNonNumeric(sB.level);

let sortWeight=4;
if(isExactMatch) sortWeight=1;
else if(isSameCategory&&!isNumericA) sortWeight=2;
else if(isNumericA&&isNumericB) sortWeight=3;

return {k,sA,sB,isNumericA,isNumericB,numA,diffValue,sortWeight,isExactMatch};

})
.sort((a,b)=>{

if(a.sortWeight!==b.sortWeight) return a.sortWeight-b.sortWeight;

if(a.sortWeight===1) return b.numA-a.numA;

if(a.sortWeight===3) return b.diffValue-a.diffValue;

return a.sA.fullName.localeCompare(b.sA.fullName);

})
.map(({sA,sB,isNumericA,isNumericB,isExactMatch,diffValue})=>{

let diffLabel="-";
let bgColor="#fff7ed";
let borderColor="#fdba74";
let textColor="#9a3412";

const displayA=isNumericA?`Level ${sA.level}`:sA.level;
const displayB=isNumericB?`Level ${sB.level}`:sB.level;
const comparisonText=(sA.level===sB.level)?displayA:`${displayA} vs ${displayB}`;

if(isExactMatch){
diffLabel="Same";
}

else if(isNumericA&&isNumericB){

diffLabel=diffValue>0?`+${diffValue}`:diffValue;

if(diffValue>0){
bgColor="#fffbeb"; borderColor="#fef3c7"; textColor="#92400e";
}
else if(diffValue<0){
bgColor="#fafaf9"; borderColor="#f5f5f4"; textColor="#57534e";
}

}

else if(!isNumericA&&!isNumericB&&!isExactMatch){
bgColor="#fafaf9"; borderColor="#f5f5f4"; textColor="#57534e";
}

return `
<div style="background:${bgColor};border:1px solid ${borderColor};color:${textColor};padding:8px 12px;border-radius:6px;font-size:12.5px;display:flex;align-items:center;justify-content:space-between; gap: 10px;">

        <span style="vertical-align:middle;">${sA.fullName}</span>

    </div>
    <div style="font-size:11px;font-weight:700;background:rgba(255,255,255,0.7);padding:2px 8px;border-radius:4px;border:1px solid rgba(0,0,0,0.08);white-space:nowrap;flex-shrink:0;">
        ${diffLabel}
    </div>
</div>`;
})
.join('')
:'<p style="font-style:italic;color:#94a3b8;padding:10px;">No identical TSC/CCS titles found.</p>';

document.getElementById('current-content-target').innerHTML=getCWFHtml(currentRole,selectedCWF);
document.getElementById('compare-content-target').innerHTML=getCWFHtml(selectedRole,currentCWF);

document.getElementById('common-skills-target').innerHTML=`

Shared TSC/CCS Competencies (${commonKeys.length})
</div>

<div class="skills-columns">
${skillsHtml}
</div>

</div>
`;
};

window.exportComparisonPDF = function () {
    try {
        const currentRole = document.getElementById('sel-role')?.value;
        const selectedRole = document.getElementById('compare-role-select')?.value;

        if (!selectedRole) {
            alert("Please select a role to compare.");
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // 1. DYNAMIC COLUMN FINDING
        const rKey = jobHeaders.find(h => h.toLowerCase().includes('role'));
        const tscCol = jobHeaders.find(h => h.toLowerCase().includes('title'));
        const pLevelCol = jobHeaders.find(h => h.toLowerCase().includes('proficiency level'));
        const rCol = cwfHeaders.find(h => h.toLowerCase().includes('role'));
        const fCol = cwfHeaders.find(h => h.toLowerCase().includes('function'));
        
        const profDescKey = skillHeaders.find(h => h.toLowerCase() === 'proficiency description') 
                            || skillHeaders.find(h => h.toLowerCase().includes('proficiency description'));

        // Helpers
        const getCWF = (role) => [...new Set(cwfData.filter(d => d[rCol] === role).map(d => d[fCol]))];
        const getRows = (role) => jobData.filter(d => d[rKey] === role);

        // Skill Lookup Map
        const skillLookup = new Map(
            skillData.map(s => [
                `${String(s[tscCol]).trim()}|${String(s[pLevelCol]).trim()}`,
                s[profDescKey]
            ])
        );

        // --- PAGE BUILDER FOR INDIVIDUAL ROLES ---
        const buildPage = (role, isSecondPage = false) => {
            if (isSecondPage) doc.addPage();

            // HEADER (Blue Strip)
            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 20, 'F');
            
            // --- NEW: DYNAMIC FONT SIZE LOGIC ---
            const roleTitle = role.toUpperCase();
            let dynamicFontSize = 14; // Default size

            if (roleTitle.length > 30) {
                // Shrink font for long titles (Minimum 8pt)
                dynamicFontSize = Math.max(10, 14 - Math.floor((roleTitle.length - 30) / 5));
            }

            doc.setFont("helvetica", "bold");
            doc.setFontSize(dynamicFontSize);
            doc.setTextColor(255, 255, 255);
            
            // Vertically center text based on dynamic font size
            // (13 is the default Y for 14pt; we adjust slightly if font is tiny)
            const textY = dynamicFontSize < 10 ? 12 : 13; 
            doc.text(roleTitle, 14, textY);

            let y = 30;

            // JOB ROLE DESCRIPTION
            const roleKeyInDesc = descHeaders.find(h => h.toLowerCase().includes('role') || h.toLowerCase().includes('job'));
            const descContentKey = descHeaders.find(h => h.toLowerCase().includes('job role description')) || descHeaders[1];
            const roleDescObj = jobDescData.find(d => String(d[roleKeyInDesc]).trim() === String(role).trim());
            const roleDesc = roleDescObj ? roleDescObj[descContentKey] : "Description not found.";

            doc.setFont("helvetica", "italic");
            doc.setFontSize(10);
            doc.setTextColor(71, 85, 105);
            const splitRoleDesc = doc.splitTextToSize(roleDesc, 182);
            doc.text(splitRoleDesc, 14, y);
            y += (splitRoleDesc.length * 4.5) + 1;

            // CRITICAL WORK FUNCTIONS
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(37, 99, 235);
            doc.text("CRITICAL WORK FUNCTIONS", 14, y);
            y += 5;

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(30, 41, 59);
            getCWF(role).forEach(f => {
                const bullet = `•  ${f}`;
                const splitF = doc.splitTextToSize(bullet, 180);
                if (y > 275) { doc.addPage(); y = 20; }
                doc.text(splitF, 16, y);
                y += (splitF.length * 5);
            });

            y += 5;

            // COMPETENCIES TABLE
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(37, 99, 235);
            doc.text("TSC", 14, y);

            const sortedRows = getRows(role).sort((a, b) => {
                const titleA = (a[tscCol] || "").toString().toLowerCase();
                const titleB = (b[tscCol] || "").toString().toLowerCase();
                return titleA.localeCompare(titleB);
            });

            const tableRows = sortedRows.map(d => {
                const tscValue = String(d[tscCol] || "").trim();
                const pLevelValue = String(d[pLevelCol] || "").trim();
                const lookupKey = `${tscValue}|${pLevelValue}`;
                const skillMatchDesc = skillLookup.get(lookupKey);

                return [
                    d[tscCol] || "-",
                    d[pLevelCol] || "-",
                    skillMatchDesc !== undefined ? skillMatchDesc : "-"
                ];
            });

            doc.autoTable({
                startY: y + 4,
                head: [['Competency', 'Level', 'Proficiency Description']],
                body: tableRows,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235], fontSize: 9, cellPadding: 2 },
                styles: { fontSize: 9, cellPadding: 2, overflow: 'linebreak', lineColor: [226, 232, 240], lineWidth: 0.1 },
                columnStyles: { 0: { cellWidth: 40, fontStyle: 'bold' }, 1: { cellWidth: 15, halign: 'center' }, 2: { cellWidth: 'auto' } },
                margin: { left: 14, right: 14, bottom: 15 },
                pageBreak: 'auto'
            });
        };

        // --- SHARED COMPETENCIES PAGE BUILDER ---
        const buildSharedPage = (role1, role2) => {
            doc.addPage();
            
            // Header (Blue Strip)
            doc.setFillColor(37, 99, 235);
            doc.rect(0, 0, 210, 20, 'F');
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(255, 255, 255);
            doc.text("SHARED COMPETENCIES", 14, 13);

            const rows1 = getRows(role1);
            const rows2 = getRows(role2);
            
            const role1Map = new Map(rows1.map(r => [String(r[tscCol]).trim(), String(r[pLevelCol]).trim()]));
            
            let sameLevelRows = [];
            let diffLevelRows = [];

            rows2.forEach(d => {
                const tscValue = String(d[tscCol] || "").trim();
                const r2Level = String(d[pLevelCol] || "").trim();
                
                if (role1Map.has(tscValue)) {
                    const r1Level = role1Map.get(tscValue);

                    if (r1Level === r2Level) {
                        const sharedDesc = skillLookup.get(`${tscValue}|${r1Level}`) || "-";
                        sameLevelRows.push([tscValue, r1Level, sharedDesc]);
                    } else {
                        // FETCH BOTH DESCRIPTIONS
                        const r1Desc = skillLookup.get(`${tscValue}|${r1Level}`) || "Description not found.";
                        const r2Desc = skillLookup.get(`${tscValue}|${r2Level}`) || "Description not found.";

                        diffLevelRows.push([
                            tscValue, 
                            `Level ${r1Level}:\n${r1Desc}`, 
                            `Level ${r2Level}:\n${r2Desc}`
                        ]);
                    }
                }
            });

            const sortFn = (a, b) => a[0].localeCompare(b[0]);
            sameLevelRows.sort(sortFn);
            diffLevelRows.sort(sortFn);

            let currentY = 30;

            if (sameLevelRows.length === 0 && diffLevelRows.length === 0) {
                doc.setFont("helvetica", "normal");
                doc.setFontSize(11);
                doc.setTextColor(71, 85, 105);
                doc.text("No shared competencies identified.", 14, currentY);
                return;
            }

            // TABLE 1: Identical Levels
            if (sameLevelRows.length > 0) {
                doc.setFontSize(11);
                doc.setTextColor(16, 120, 80);
                doc.text(`Identical Proficiency Levels (${sameLevelRows.length})`, 14, currentY);
                
                doc.autoTable({
                    startY: currentY + 4,
                    head: [['Shared Competency', 'Level', 'Shared Description']],
                    body: sameLevelRows,
                    theme: 'striped',
                    headStyles: { fillColor: [16, 120, 80], fontSize: 8.5 },
                    styles: { fontSize: 8.5, cellPadding: 2, lineColor: [226, 232, 240], lineWidth: 0.1 },
                    columnStyles: { 0: { cellWidth: 40, fontStyle: 'bold' }, 1: { cellWidth: 15, halign: 'center' } },
                    margin: { left: 14, right: 14 }
                });
                currentY = doc.lastAutoTable.finalY + 12;
            }

            // TABLE 2: Differing Levels (Amended)
            if (diffLevelRows.length > 0) {
                if (currentY > 240) { doc.addPage(); currentY = 25; }
                
                doc.setFontSize(11);
                doc.setTextColor(190, 18, 60); 
                doc.text(`Differing Proficiency Levels (${diffLevelRows.length})`, 14, currentY);

                doc.autoTable({
                    startY: currentY + 4,
                    head: [['Competency', `(R1) ${currentRole}`, `(R2) ${selectedRole}`]],
                    body: diffLevelRows,
                    theme: 'striped',
                    headStyles: { fillColor: [190, 18, 60], fontSize: 8.5 },
                    styles: { 
                        fontSize: 8.5, 
                        cellPadding: 3, 
                        lineColor: [226, 232, 240], 
                        lineWidth: 0.1,
                        overflow: 'linebreak' 
                    },
                    columnStyles: { 
                        0: { cellWidth: 35, fontStyle: 'bold' }, 
                        1: { cellWidth: 73 }, 
                        2: { cellWidth: 73 } 
                    },
                    margin: { left: 14, right: 14 }
                });
            }
        };

        // Execution Flow
        buildPage(currentRole, false);
        buildPage(selectedRole, true);
        buildSharedPage(currentRole, selectedRole);

        // Global Footer
        const pageCount = doc.internal.getNumberOfPages();
        for(let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(9);
            doc.setTextColor(148, 163, 184);
            doc.text(`Page ${i} of ${pageCount} | Role Comparison Report`, 105, 290, { align: 'center' });
        }

        doc.save(`Comparison_${currentRole}_vs_${selectedRole}.pdf`);

    } catch (err) {
        console.error("PDF Export Error:", err);
        alert("Failed to generate PDF. Check console for details.");
    }
};

        const cols = [...new Set(filtered.map(d => JSON.stringify([d[c1], c2!=='none'?d[c2]:''])))].map(s=>JSON.parse(s)).sort();
        
        hHtml = `<tr><th style="background: #f1f5f9; color: #475569; font-size: 0.95em; text-align: left;">${cornerText}</th>` +

        rows.forEach(rp => {

            cols.forEach(cp => {

                let cellContent = "";
                if (isClassificationView) {

                    let hasK = false, hasA = false;
                    const seenInCell = new Set();
                    sortedCell.forEach(d => {
                        const type = (d[classKey] || "").toLowerCase();
                        const id = `${d[v]}|${type}`;
                        if (!seenInCell.has(id)) {
                            // Suppress headers if classification is already used as a column
                            if (!isClassInCols) {
                                if (type.includes('knowledge') && !hasK) { 
                                    cellContent += `<div style="font-weight:bold; font-size:10px; color:#64748b; margin:0 0 4px 0; text-transform:uppercase;">Knowledge</div>`; 
                                    hasK = true; 
                                } else if (type.includes('ability') && !hasA) { 
                                    const topM = hasK ? "8px" : "0px";
                                    cellContent += `<div style="font-weight:bold; font-size:10px; color:#64748b; margin:${topM} 0 4px 0; text-transform:uppercase;">Ability</div>`; 
                                    hasA = true; 
                                }
                            }
                            cellContent += formatContentItem(formatValue(d[v], v, false), d[classKey]);
                            seenInCell.add(id);
                        }
                    });
                } else {
                    const uniqueTexts = [...new Set(cellData.map(d => d[v]))].filter(i => i && i !== '-');
                    cellContent = uniqueTexts.map(txt => formatContentItem(formatValue(txt, v, false))).join('');
                }
                bHtml += `<td>${cellContent || '-'}</td>`;
            });
            bHtml += `</tr>`;
        });
    }
    document.getElementById('h').innerHTML = hHtml;
    document.getElementById('b').innerHTML = bHtml;
}

        const roleData = jobData.find(d => d[rKey] === selectedRole);
        displayTrack = roleData ? (roleData[tKey] || "N/A") : "N/A";
    }

    doc.setFillColor(...primaryEmerald);
    doc.rect(0, 0, pageWidth, 20, 'F');

    doc.setTextColor(255,255,255);

    const titlePrefix = "Job Competency Map: ";
    const fullTitle = titlePrefix + selectedRole;

    const maxTitleWidth = pageWidth - 28;

    let fontSize = 18;

    doc.setFont("helvetica","bold");
    doc.setFontSize(fontSize);

    while (doc.getTextWidth(fullTitle) > maxTitleWidth && fontSize > 10) {
        fontSize -= 1;
        doc.setFontSize(fontSize);
    }

    const titleY = fontSize > 14 ? 13 : 12;

    doc.text(fullTitle, 14, titleY);

    doc.setFont("helvetica","normal");

    const headerString = `SECTOR: ${selectedSector.toUpperCase()} | TRACK: ${displayTrack.toUpperCase()}`;

    let subFont = 10;
    doc.setFontSize(subFont);

    let split = doc.splitTextToSize(headerString, maxTitleWidth);

    while (split.length > 1 && subFont > 7) {
        subFont -= 0.5;
        doc.setFontSize(subFont);
        split = doc.splitTextToSize(headerString, maxTitleWidth);
    }

    doc.text(split[0], 14, 18);
};
        const handleManualPageBreak = (currentY, neededHeight) => {
            if (currentY + neededHeight > pageHeight - 20) {
                doc.addPage('l');
                renderHeader();
                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.setTextColor(30, 41, 59);
                doc.text("CRITICAL WORK FUNCTIONS & KEY TASKS (CONTINUED)", 14, 32);
                return 40;
            }
            return currentY;
        };
        // --- PAGE 1: START ---
        renderHeader();
        let y = 32;
        if (roleDescription && roleDescription.trim() !== "") {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(12);
            doc.setTextColor(30, 41, 59);
            doc.text("JOB ROLE DESCRIPTION", 14, y);
            y += 6;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(71, 85, 105);
            
            const splitDesc = doc.splitTextToSize(roleDescription, availableWidth - 4);
            const descHeight = (splitDesc.length * 4) + 4;
            doc.setFillColor(240, 253, 244);
            doc.roundedRect(14, y - 4, availableWidth, descHeight, 2, 2, 'F');
            doc.text(splitDesc, 16, y + 1);
            y += descHeight + 10;
        }
       const groups = document.querySelectorAll('.cwf-group');
if (groups.length > 0) {
    let totalTasksCount = 0;
    groups.forEach(g => { totalTasksCount += g.querySelectorAll('.task-item').length; });
    
    y = handleManualPageBreak(y, 10);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(12);
    doc.setTextColor(30, 41, 59);
    doc.text(`Critical Work Functions (${groups.length}) & Key Tasks (${totalTasksCount})`, 14, y);
    y += 8;

    groups.forEach(g => {
        const headerEl = g.querySelector('.cwf-header');
        if (!headerEl) return;
        
        const rawHeaderText = cleanText(headerEl.innerText);
        
        // 1. SPLIT THE TEXT INTO AN ARRAY OF LINES
        // Width is pageWidth minus margins (28) and internal padding (10)
        const maxTextWidth = pageWidth - 38; 
        const splitHeader = doc.splitTextToSize(rawHeaderText, maxTextWidth);
        const lineCount = splitHeader.length;
        
        // 2. CALCULATE BOX HEIGHT BASED ON LINE COUNT
        // 5 units per line + 4 units of padding
        const boxHeight = (lineCount * 5) + 3;

        // Ensure header + box fit on page
        y = handleManualPageBreak(y, boxHeight + 10);
        
        // 3. DRAW THE GREY BUBBLE
        doc.setFillColor(241, 245, 249);
        doc.roundedRect(14, y - 5, pageWidth - 28, boxHeight, 2, 2, 'F');
        
        // 4. DRAW THE WRAPPED TEXT
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10.5);
        doc.setTextColor(...darkGreen);
        
        // IMPORTANT: Pass 'splitHeader' (the array), NOT 'rawHeaderText'
        // This forces jsPDF to respect the line breaks
        doc.text(splitHeader, 18, y); 

        // 5. UPDATE Y POSITION FOR TASKS
        // Move Y down by the box height we just used
        y += boxHeight + 3; 
        
        g.querySelectorAll('.task-item').forEach(t => {
            const text = "•  " + cleanText(t.innerText);
            const split = doc.splitTextToSize(text, pageWidth - 40);
            const blockHeight = split.length * 5.2;
            
            y = handleManualPageBreak(y, blockHeight);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.setTextColor(71, 85, 105);
            doc.text(split, 20, y);
            y += blockHeight;
        });
        y += 4;
    });
}
// --- PAGE 2: SKILLS MATRIX ---
doc.addPage('l');
let tableStartPage = null;
const rows = Array.from(tableEl.querySelectorAll('tr'));
const colCount = (rows[0] && rows[0].cells) ? rows[0].cells.length : 0;
let finalColumnStyles = {};

if (colCount > 0) {
    const firstColWidth = 100; 
    let shortCols = [];

    // Detect columns where ALL body cells have 5 words or less
    for (let colIdx = 1; colIdx < colCount; colIdx++) {
        let isColumnShort = true;
        rows.forEach((row) => {
            const cell = row.cells[colIdx];
            if (cell) {
                const txt = cleanText(cell.innerText);
                const wordCount = txt ? txt.split(/\s+/).filter(w => w.length > 0).length : 0;
                if (wordCount > 5) isColumnShort = false;
            }
        });
        if (isColumnShort) shortCols.push(colIdx);
    }

    const totalShortWidth = shortCols.length * 35; 
    const remainingWidth = Math.max(availableWidth - firstColWidth - totalShortWidth, 50);
    const remainingColCount = colCount - 1 - shortCols.length;
    const dynamicWidth = remainingColCount > 0 ? (remainingWidth / remainingColCount) : 0;
    
    finalColumnStyles[0] = { cellWidth: firstColWidth };
    for (let i = 1; i < colCount; i++) {
        finalColumnStyles[i] = { cellWidth: shortCols.includes(i) ? 35 : dynamicWidth };
    }
}

// --- PAGE 2: SKILLS MATRIX ---
doc.autoTable({
    html: '#grid',
    startY: 45,
    margin: { top: 50, left: tableMargin, right: tableMargin },
    theme: 'plain', 
    tableWidth: 'fixed',
    rowPageBreak: 'auto', 
    columnStyles: finalColumnStyles,
    styles: {
        fontSize: 10,
        cellPadding: { top: 5, right: 5, bottom: 5, left: 8 },
        font: "helvetica",
        lineColor: [240, 242, 245],
        lineWidth: 0.1,
        valign: 'top',
        overflow: 'linebreak'
    },
    headStyles: {
        fillColor: [255, 255, 255], 
        textColor: [16, 120, 80],
        fontSize: 10,
        fontStyle: 'bold'
    },

    didParseCell: (data) => {
    const cellRaw = data.cell.raw;
    if (!cellRaw || data.section !== 'body') return;

    // --- NEW: COLOR PERSISTENCE LOGIC ---
    // Define your colors
    const darkGreen = [16, 120, 80];
    const lightGreen = [52, 211, 153];
    
    // Assign the color to the cell object based on row index
    // This stays with the row even if it splits
    data.cell.accentColor = (data.row.index % 2 === 0) ? darkGreen : lightGreen;

    const isFirstCol = data.column.index === 0;
    const rawHeader = data.table.head[0].cells[data.column.index].raw.innerText || "";
    const headerText = cleanText(rawHeader).toLowerCase();
    const isKnowledgeAbilityCol = headerText.includes('knowledge') && headerText.includes('ability');

    // 1. Prepare HTML for splitting (handle line breaks and list items)
    let htmlContent = cellRaw.innerHTML.replace(/<\/li>|<br\s*\/?>|<\/p>|<\/div>/g, '|SPLIT|');
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlContent;
    const plainText = tempDiv.textContent || tempDiv.innerText || "";
    let rawLines = plainText.split('|SPLIT|').map(l => l.trim()).filter(l => l.length > 0 && l !== "-");

    // 2. Helper to strip weird hyperlink whitespace, tabs, and newlines
    const sanitize = (str) => {
        if (!str) return "";
        // Uses your cleanText function + regex to collapse whitespace
        return cleanText(str).replace(/\s+/g, ' ').trim();
    };

    let finalLines = [];

    if (isFirstCol) {
        // --- LOGIC FOR FIRST COLUMN (TIERS) ---
        const t1 = sanitize(cellRaw.querySelector('.skill-link')?.innerText || cellRaw.childNodes[0]?.textContent);
        const t2 = sanitize(cellRaw.querySelector('.tier-2')?.innerText);
        const t3 = sanitize(cellRaw.querySelector('.tier-3')?.innerText);

        // TIER 1: Uppercase Header
        if (t1) { 
            finalLines.push(t1.toUpperCase()); 
            finalLines.push(""); 
        } 
        
        // TIERS 2 & 3: Bullets and indentation
        if (t2) { 
            finalLines.push(t2); 
            finalLines.push(""); 
        }
        if (t3) { 
            finalLines.push(t3); 
            finalLines.push(""); 
        }

        // Apply specific styling for the first column
        data.cell.styles.halign = 'left'; 
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.textColor = [30, 41, 59];
    } else {
        // --- LOGIC FOR ALL OTHER COLUMNS ---
        data.cell.styles.fontStyle = 'normal';
        data.cell.styles.textColor = [71, 85, 105];

        rawLines.forEach(line => {
            // FIX: We now sanitize every line in the other columns too
            const cleanedLine = sanitize(line);
            
            if (cleanedLine.length > 0) {
                // If it's a Knowledge/Ability column, add a bullet point
                finalLines.push(isKnowledgeAbilityCol ? "• " + cleanedLine : cleanedLine);
                // Add an empty string to create spacing between items
                finalLines.push(""); 
            }
        });
    }

    // 3. Final Cleanup: Remove the very last empty line so the cell doesn't have extra bottom padding
    if (finalLines.length > 0 && finalLines[finalLines.length - 1] === "") {
        finalLines.pop();
    }

    // 4. Overwrite the cell text with our cleaned array
    data.cell.text = finalLines;
},
willDrawCell: (data) => {
    if (data.section === 'body') {
        // 1. Alternating Row Background
        const isEven = data.row.index % 2 === 0;
        const fillColor = isEven ? [255, 255, 255] : [249, 250, 251];
        doc.setFillColor(...fillColor);
        doc.rect(data.cell.x, data.cell.y, data.cell.width, data.cell.height, 'F');

        // 2. Accent Bar Logic (Retrieving the persistent color)
        if (data.column.index === 0 && data.cell.accentColor) {
            doc.setFillColor(...data.cell.accentColor);
            
            // Draw the bar
            doc.roundedRect(
                data.cell.x + 2, 
                data.cell.y + 3, 
                2.5, 
                data.cell.height - 6, 
                1, 1, 'F'
            );
        }
        
        // Ensure autoTable doesn't overwrite our manual background
        data.cell.styles.fillColor = false;
    }
    
    // Header logic (Keep as is)
    if (data.section === 'head') {
        const { x, y, width: w, height: h } = data.cell;
        doc.setFillColor(209, 250, 229); 
        doc.roundedRect(x + 1, y + 2, w - 2, h - 4, 3, 3, 'F');
        data.cell.styles.fillColor = false;
    }
},

    didDrawPage: (data) => {
        renderHeader();
        if (typeof tableStartPage === 'undefined' || tableStartPage === null) {
            tableStartPage = data.pageNumber;
        }
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(30, 41, 59);
        const label = (data.pageNumber === tableStartPage) ? "SKILLS MATRIX" : "SKILLS MATRIX (CONTINUED)";
        doc.text(label, 14, 40);
    }
});

// --- ADD PAGE NUMBERS (FOOTER) ---
isFooterPhase = true; // Turn the flag ON
const totalPages = doc.internal.getNumberOfPages();

for (let i = 1; i <= totalPages; i++) {
    doc.setPage(i); 
    // Now setPage(i) won't trigger the header logic recursively
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(148, 163, 184);

    const footerText = `Page ${i} of ${totalPages}`;
    const textWidth = doc.getTextWidth(footerText);
    doc.text(footerText, (pageWidth / 2) - (textWidth / 2), pageHeight - 10);
}

        doc.save(`Map_${selectedRole.replace(/\s+/g, '_')}.pdf`);
    } catch (error) {
        console.error("PDF Export Error Detailed:", error);
        alert("Critical Error: " + error.message);
    }
}
